# Synthetic mail dataset configuration.
# Every value here can be changed without touching code. CLI flags in generate.py
# (--illegible-rate, --augment-strength, ...) override the matching keys below.

# The shelter that receives mail on behalf of residents. This is a FICTIONAL
# street in Chapel Hill, NC, formatted like a real address so address parsing
# behaves as it would on real mail. Replace with your real shelter address if
# you want the dataset to match production mail exactly.
shelter:
  name: Harbor Light Community Shelter
  # Name variants senders actually write after "c/o" (abbreviations, partial names).
  aliases:
    - Harbor Light Community Shelter
    - Harbor Light Shelter
    - Harbor Light
    - HLCS
  street: 214 Bellweather Lane
  city: Chapel Hill
  state: NC
  zip: "27516"
  zip4: "3021"          # used occasionally by printed business mail (ZIP+4)
  # Optional PO box some senders use instead of the street address.
  po_box: PO Box 2391
  po_box_zip: "27515"
  po_box_rate: 0.10     # fraction of addressed mail that uses the PO box

# received_at simulates when staff logged the item (not printed on the envelope).
received_at:
  start: "2026-01-02"
  end: "2026-10-30"
  timezone: America/New_York
  business_hours: [8, 18]   # [start_hour, end_hour); null for any time of day
  weekdays_only: true

# Fraction of samples that are deliberately hard / illegible (CLI: --illegible-rate).
illegible_rate: 0.10
# Relative weights of the illegible failure modes.
illegible_reasons:
  heavy_blur: 0.22
  water_damage: 0.18
  smudge: 0.12
  sticker_cover: 0.16
  overlapping_envelope: 0.14
  messy_handwriting: 0.12
  extreme_low_light: 0.06

# Relative weights of sender types.
sender_types:
  government: 0.26
  bank: 0.14
  healthcare: 0.14
  employer: 0.08
  personal: 0.16
  junk: 0.22

recipient:
  # How the recipient block is addressed (relative weights).
  addressing:
    care_of: 0.58        # Name / c/o Shelter / shelter address
    direct: 0.28         # Name / shelter address (no c/o line)
    name_only: 0.14      # just a name, no address at all
  misspelling_rate: 0.12   # name printed with a typo
  nickname_rate: 0.10      # first name printed as a nickname (Bill for William)
  middle_initial_rate: 0.25
  junk_current_resident_rate: 0.35  # junk mail adds/uses "CURRENT RESIDENT"

notes:
  printed_endorsement_rate: 0.45   # applies to organization mail
  rubber_stamp_rate: 0.12          # red "URGENT"-style stamps (organization mail)
  handwritten_note_rate_personal: 0.35
  handwritten_note_rate_org: 0.05
  back_note_rate_personal: 0.20    # handwritten note on the back flap

sender_address:
  # Personal letters: where the return address is written.
  personal_location:
    front: 0.55
    back: 0.25
    both: 0.08
    none: 0.12
  # Organization mail occasionally repeats the return address on the back flap.
  org_back_flap_rate: 0.07

envelope:
  window_rate_business: 0.55   # #10 / 6x9 organization mail with an address window
  recipient_label_rate_large: 0.4  # large envelopes with a printed address label

render:
  long_side_px: 1600     # envelope is rendered so its long side is this many px

output:
  width: 1600
  height: 1200
  jpeg_quality: 90
  id_prefix: mail_

# Phone-photo augmentation presets (CLI: --augment-strength none|light|medium|heavy).
# p_* are probabilities; ranges are [min, max] sampled uniformly.
augment:
  none:
    background: [solid]
    fill: [0.86, 0.9]
    rotation_deg: 0
    tilt_deg: 0
    crop_prob: 0
  light:
    background: [solid, wood, laminate, fabric, clutter]
    fill: [0.72, 0.9]
    rotation_deg: 5
    tilt_deg: 8
    crop_prob: 0.05
    crop_frac: 0.05
    p_lighting: 0.5
    lighting_strength: [0.05, 0.2]
    p_shadow: 0.15
    shadow_strength: [0.15, 0.3]
    p_low_light: 0.1
    low_light_gain: [0.7, 0.9]
    p_defocus: 0.15
    defocus_radius: [1, 2]
    p_motion: 0.1
    motion_length: [3, 6]
    p_noise: 0.3
    noise_sigma: [0.005, 0.015]
    p_jpeg: 0.3
    jpeg_quality: [70, 90]
  medium:
    background: [solid, wood, laminate, fabric, clutter, clutter]
    fill: [0.6, 0.9]
    rotation_deg: 12
    tilt_deg: 20
    crop_prob: 0.15
    crop_frac: 0.1
    p_lighting: 0.75
    lighting_strength: [0.1, 0.35]
    p_shadow: 0.35
    shadow_strength: [0.2, 0.45]
    p_low_light: 0.25
    low_light_gain: [0.5, 0.8]
    p_defocus: 0.3
    defocus_radius: [1, 3.5]
    p_motion: 0.2
    motion_length: [4, 11]
    p_noise: 0.6
    noise_sigma: [0.01, 0.03]
    p_jpeg: 0.6
    jpeg_quality: [45, 85]
  heavy:
    background: [wood, laminate, fabric, clutter, clutter]
    fill: [0.5, 0.88]
    rotation_deg: 25
    tilt_deg: 32
    crop_prob: 0.3
    crop_frac: 0.15
    p_lighting: 0.9
    lighting_strength: [0.2, 0.5]
    p_shadow: 0.55
    shadow_strength: [0.3, 0.6]
    p_low_light: 0.4
    low_light_gain: [0.35, 0.7]
    p_defocus: 0.45
    defocus_radius: [1.5, 5]
    p_motion: 0.35
    motion_length: [6, 16]
    p_noise: 0.8
    noise_sigma: [0.015, 0.05]
    p_jpeg: 0.8
    jpeg_quality: [30, 75]

# A non-illegible sample is labelled "degraded" (instead of "clear") when the
# front photo crosses any of these thresholds. Pixel values are at output size.
degraded_thresholds:
  defocus_radius: 2.5
  motion_length: 9
  noise_sigma: 0.03
  low_light_gain: 0.55
  jpeg_quality: 45
  shadow_strength: 0.45
  min_recipient_text_height_px: 14
